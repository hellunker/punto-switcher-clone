name: Build PuntoSwitcherClone

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Позволяет запускать процесс вручную из интерфейса GitHub

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install keyboard pyautogui pywin32 PyQt5 pillow
    
    - name: Create icon
      run: |
        python create_icon.py
      
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --icon=app_icon.ico --add-data "app_icon.ico;." punto_switcher_clone.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v2
      with:
        name: PuntoSwitcherClone
        path: dist/*.exe
